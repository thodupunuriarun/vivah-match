name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JS syntax
        run: |
          set -e
          for f in dist/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Check sitemap is up to date
        run: node scripts/generate-sitemap.mjs --check
      - name: Check _headers is up to date
        run: node scripts/generate-headers.mjs --check
      - name: Check internal links
        run: node scripts/check-links.mjs

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy to Cloudflare Pages
        run: npx wrangler@4 pages deploy dist --project-name matchmyjathakam --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
